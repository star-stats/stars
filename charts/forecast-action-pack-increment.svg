  <style>
    @keyframes drawLine {
      to { stroke-dashoffset: 0; }
    }
    @keyframes fadeInPoint {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .data-line-0 {
      stroke-dasharray: 1201;
      stroke-dashoffset: 1201;
      animation: drawLine 2s ease-out forwards;
    }
