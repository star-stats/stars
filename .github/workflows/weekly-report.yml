name: Weekly Report

on:
  schedule:
    - cron: '0 06 * * 1' # Runs at 2 AM, only on Monday
  workflow_dispatch:

permissions:
  contents: read

jobs:
  Track:
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      -
        name: Generate report
        id: tracker
        uses: fbuireu/github-star-tracker@v1
        with:
          read-only: true
          top-repos: 500
          data-branch: data
          visibility: public
          include-forks: true
          include-charts: true
          smart-sampling: true
          chart-line-width: 2.5
          chart-line-color: 6b63ff
          chart-y-axis-side: right
          chart-smoothing: true
          chart-milestones: false
          exclude-repos: .github
          velocity-metrics: true
          compare-against: '7d'
          only-orgs: dockur,qemus,dobtc,vdsm,action-pack
          github-token: ${{ secrets.STAR_TRACKER_TOKEN }}
      -
        name: Send report
        uses: action-pack/send-mail@v1
        with:
          to: ${{secrets.MAILTO}}
          from: Github Star Tracker <${{secrets.MAILTO}}>
          connection_url: ${{secrets.MAIL_CONNECTION}}
          subject: '⭐ Weekly stars overview'
          html_body: file://${{ steps.tracker.outputs.report-html-path }}
